name: CI

on:
  pull_request:
  push:
    branches: [main, production]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Tests and migrations never use production settings or secrets.
  APP_ENV: test
  # Every install comes from the hash-locked export of uv.lock, wheels only.
  PIP_INSTALL: "pip install --require-hashes --only-binary :all: -r requirements-dev.lock"

jobs:
  lock:
    name: Lockfile em sincronia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
      - name: uv.lock corresponde ao pyproject.toml
        run: uv lock --check
      - name: Exportações com hash atualizadas
        run: |
          uv export -q --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/req.lock
          uv export -q --frozen --extra dev --no-emit-project --format requirements-txt -o /tmp/req-dev.lock
          diff <(grep -v '^#' requirements.lock) <(grep -v '^#' /tmp/req.lock)
          diff <(grep -v '^#' requirements-dev.lock) <(grep -v '^#' /tmp/req-dev.lock)

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: ${{ env.PIP_INSTALL }}
      - run: ruff check .

  test:
    name: Pytest + cobertura
    runs-on: ubuntu-latest
    # Disposable PostGIS for the integration tests (tests/postgis.py): each
    # test module creates and drops its own database on this server.
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ignis
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ignis -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      IGNIS_TEST_POSTGIS_URL: postgresql://ignis:ci-only-password@localhost:5432/postgres
      # Here a missing database is a failure, never a silent skip.
      IGNIS_REQUIRE_POSTGIS_TESTS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: ${{ env.PIP_INSTALL }}
      - name: pytest
        # A failing test or coverage below the floor fails this check.
        run: >
          python -m pytest -q
          --cov=app --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml
          --cov-fail-under=75
          --junitxml=pytest-report.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-coverage
          path: |
            coverage.xml
            pytest-report.xml
          retention-days: 14

  migrations:
    name: Migrations (PostGIS isolado)
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ignis
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ignis_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ignis -d ignis_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://ignis:ci-only-password@localhost:5432/ignis_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: ${{ env.PIP_INSTALL }}
      - name: upgrade → downgrade → upgrade
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current
      - name: Seed idempotente (APP_ENV=test)
        run: |
          python -m seed
          python -m seed
      - name: Seed é recusado em ambientes operacionais
        env:
          JWT_SECRET_KEY: ci-strong-secret-0123456789abcdef0123456789abcdef
          CORS_ORIGINS: https://ignis-web-ci.up.railway.app
        run: |
          for env in production staging; do
            if APP_ENV=$env python -m seed; then
              echo "::error::seed executou com APP_ENV=$env"; exit 1
            fi
            APP_ENV=$env python -m seed --if-allowed | grep -q "ignorado"
          done
      - name: Procedimento de usuários demo (check → bootstrap → deactivate → check)
        run: |
          set +e
          python -m seed.demo_users check; rc=$?
          test "$rc" = "4" || exit 1   # seed accounts detected as risky
          python -m seed.demo_users deactivate --confirm-host localhost; rc=$?
          test "$rc" = "3" || exit 1   # refused: would leave no legitimate admin
          set -e
          # Random per run: no credential literal in the repository.
          python -c "import secrets; print(secrets.token_urlsafe(24))" \
            | python -m seed.bootstrap_admin --email admin.ci@example.org --name "Admin CI"
          python -m seed.demo_users deactivate --confirm-host localhost
          python -m seed.demo_users check   # now clean: exit 0
      - name: Pre-deploy do Railway (papel migrate, URL no formato do Railway)
        env:
          JWT_SECRET_KEY: ci-strong-secret-0123456789abcdef0123456789abcdef
          CORS_ORIGINS: https://ignis-web-ci.up.railway.app
          # Railway exposes postgresql://; Settings switches it to the asyncpg dialect.
          DATABASE_URL: postgresql://ignis:ci-only-password@localhost:5432/ignis_ci
          RAILWAY_ENVIRONMENT_NAME: staging
        run: |
          APP_ENV=staging bash scripts/entrypoint.sh migrate
          APP_ENV=staging alembic current | grep -q "(head)"
          # A staging service carrying production's APP_ENV must refuse to start.
          if APP_ENV=production bash scripts/entrypoint.sh migrate; then
            echo "::error::migrate aceitou APP_ENV=production no ambiente Railway staging"; exit 1
          fi
      - name: Jurisdições oficiais do IBGE (184 municípios, reexecução sem alteração)
        run: |
          # The migrate role above already imported them; a second run must change nothing.
          python -m seed.jurisdictions | tee /tmp/jurisdictions.txt
          grep -q "inseridas 0, atualizadas 0, sem alteração 185" /tmp/jurisdictions.txt
          python - <<'PY'
          import asyncio, asyncpg
          async def main():
              conn = await asyncpg.connect("postgresql://ignis:ci-only-password@localhost:5432/ignis_ci")
              rows = await conn.fetch(
                  "SELECT level, count(*) AS n, bool_and(ST_IsValid(geom)) AS valid,"
                  " bool_and(ST_SRID(geom) = 4326) AS srid FROM jurisdictions GROUP BY level")
              counts = {r["level"]: r["n"] for r in rows}
              print(counts)
              assert counts == {"state": 1, "municipality": 184}, counts
              assert all(r["valid"] and r["srid"] for r in rows)
              await conn.close()
          asyncio.run(main())
          PY
      - name: Healthcheck da API contra o banco migrado
        run: |
          python -m uvicorn app.main:app --port 8000 &
          for _ in $(seq 1 30); do curl -sf localhost:8000/ready && break; sleep 1; done
          curl -sf localhost:8000/health
          curl -sf localhost:8000/ready | grep -q '"connected"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/v1/orbital-alerts/ingest)" = "401"

  railway-iac:
    name: Railway IaC (tipos + contrato)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .railway
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .railway/package-lock.json
      # No dependency needs lifecycle scripts; never run them (supply chain).
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - name: Invariantes de implantação (branches, Wait for CI, migrations, segredos)
        run: npm run check
      - name: npm audit (SDK de IaC)
        run: npm audit --audit-level=high

  dependencies:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: ${{ env.PIP_INSTALL }}
      - name: pip-audit das dependências de produção (falha com vulnerabilidade conhecida)
        run: pip-audit -r requirements.lock --require-hashes --disable-pip --progress-spinner off
      - name: pip-audit das dependências de desenvolvimento
        run: pip-audit -r requirements-dev.lock --require-hashes --disable-pip --progress-spinner off

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build (sem push)
        run: docker build -t ignis-orbital-api:ci .
      - name: Imagem importa a aplicação, roda como não-root e sem escrita no código
        run: |
          docker run --rm --entrypoint python ignis-orbital-api:ci -c "import app.main"
          test "$(docker run --rm --entrypoint id ignis-orbital-api:ci -u)" != "0"
          if docker run --rm --entrypoint sh ignis-orbital-api:ci -c "touch /app/app/x.py"; then
            echo "::error::código da aplicação gravável pelo usuário de runtime"; exit 1
          fi
      - name: Malha oficial do IBGE embarcada na imagem e íntegra (SHA-256)
        run: docker run --rm --entrypoint python ignis-orbital-api:ci -m seed.jurisdictions --verify-files
      - name: Container recusa iniciar sem APP_ENV
        run: |
          if docker run --rm --entrypoint /app/scripts/entrypoint.sh ignis-orbital-api:ci; then
            echo "::error::entrypoint iniciou sem APP_ENV"; exit 1
          fi

  sonarcloud:
    name: SonarQube Cloud (cobertura)
    needs: test
    # Opt-in: requires the SONAR_TOKEN secret AND the repository variable
    # SONAR_CI_ANALYSIS=true, set only after disabling Automatic Analysis in
    # SonarQube Cloud (both modes cannot run on the same project).
    if: vars.SONAR_CI_ANALYSIS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-coverage
      - uses: SonarSource/sonarqube-scan-action@1a6d90ebcb0e6a6b1d87e37ba693fe453195ae25 # v5.3.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
